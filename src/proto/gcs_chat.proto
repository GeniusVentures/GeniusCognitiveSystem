syntax = "proto3";

package gcs.chat;

// Wire codec bound to a store at creation (D-29: per-store codec choice).
enum Codec {
  CODEC_UNSPECIFIED = 0;
  CODEC_PROTOBUF = 1;
  CODEC_JSON = 2;
}

// Store/session configuration carried by gcs_init bytes (D-29: codec bound at creation).
message GcsConfig {
  string db_path = 1;
  Codec codec = 2;
  // Optional mnemonic for the embedded SGNUS node's signing identity. Empty
  // (default) = the SDK boots with the wallet persisted under the base path,
  // creating a fresh CHILD WALLET when none exists; that child wallet connects
  // to a parent wallet through other mechanisms (Child Wallets, later phase).
  // Non-empty = boot the provided account's wallet directly.
  string mnemonic = 3;
}

// Message role taxonomy (D-18).
enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_USER_SELF = 1;
  MESSAGE_ROLE_USER_PEER = 2;
  MESSAGE_ROLE_ASSISTANT = 3;
  MESSAGE_ROLE_SYSTEM = 4;
}

// Message state taxonomy (D-19).
enum MessageState {
  MESSAGE_STATE_UNSPECIFIED = 0;
  MESSAGE_STATE_PENDING = 1;
  MESSAGE_STATE_STREAMING = 2;
  MESSAGE_STATE_THINKING = 3;
  MESSAGE_STATE_COMPLETE = 4;
  MESSAGE_STATE_ERROR = 5;
}

// Thin chat-shaped struct Dart publishes for a send (D-27: data-only; C++ stamps authority).
message SendTextCommand {
  string room_topic = 1;
  string text = 2;
}

// Join a chat room topic (C++ joins GossipSub and pushes the updated RoomList).
message JoinTopicCommand {
  string room_topic = 1;
}

// Envelope for every Dart -> C++ command publish (D-27: commands are topic publishes).
message GcsCommand {
  oneof payload {
    JoinTopicCommand join_topic = 1;
    SendTextCommand send_text = 2;
    CreateSpaceCommand create_space = 3;
    CreateRoomCommand create_room = 4;
    UpdateSpaceCommand update_space = 5;
    InviteCommand invite = 6;              // D-05 mint a `gcs://invite/...` capability link
    RedeemCommand redeem = 7;              // D-05 redeem an invite link
    ChangeRoleCommand change_role = 8;     // D-03/D-08 full-state role change
    RemoveMemberCommand remove_member = 9; // D-07 member removal (dormant when 2+ admins)
    LeaveCommand leave = 10;               // D-02 explicit leave of the caller's own record
    DeleteScopeCommand delete_scope = 11;  // D-07 scope deletion (dormant when 2+ admins)
    ApproveCommand approve = 12;           // D-07 Super Admin activates a dormant op
  }
}

// Authoritative message record. This proto type IS the C++ half (D-24 reinterpreted by D-26):
// C++ stamps id/timestamp/role/state; Dart renders.
message ChatMessageState {
  string id = 1;
  string room_topic = 2;
  MessageRole role = 3;
  MessageState state = 4;
  string text = 5;
  int64 timestamp = 6;
  string sender = 7;        // D-04 wallet address, C++-stamped (unsigned, display-only)
  bool deleted = 8;         // D-05 tombstone fields, present from creation
  int64 deleted_at_ms = 9;  // (mirrors SpaceRecord deleted/deleted_at_ms)
}

// Pushed room-list event (D-21/D-26): the set of topics the session is in.
message RoomList {
  repeated string room_topic = 1;
}

// Pushed readiness event (D-26): true once init + smoke-topic pre-join completes.
message Readiness {
  bool ready = 1;
}

// Pushed raw error string (D-29: errors cross FFI as raw strings on the push port).
message ErrorNotice {
  string message = 1;
}

// Envelope for every C++ -> Dart pushed event (D-26 push-not-pull).
message GcsEvent {
  oneof payload {
    ChatMessageState message = 1;
    RoomList room_list = 2;
    Readiness readiness = 3;
    ErrorNotice error = 4;
    SpaceTree space_tree = 5;
    MessageHistory message_history = 6;
    MemberList member_list = 7;  // D-04 flat full-replacement roster push
    InviteLink invite_link = 8;  // D-05 pushed invite link
  }
}

// === Phase 2: Spaces & Rooms (append-only additions — D-24/D-26) ===

// Authoritative persistent space entity record. This proto type IS the C++ half
// (D-01/D-02): C++ stamps id/timestamps/tombstone; Dart renders. Stored as the
// value bytes under `gcs/entities/spaces/<id>`. Name is mutable display
// metadata; id is identity.
message SpaceRecord {
  string id = 1;             // opaque C++-minted id (D-01)
  string name = 2;
  bool is_public = 3;
  bool auto_join_rooms = 4;  // D-04 derived-join source of truth
  int64 created_at_ms = 5;   // wall-clock ms (same stamp as ChatMessageState)
  int64 updated_at_ms = 6;
  bool deleted = 7;          // D-03 tombstone fields, present from creation,
  int64 deleted_at_ms = 8;   // set by NO Phase 2 command
  string creator = 9;              // D-03 Super Admin identity — never demotable
  bool members_can_invite = 10;    // P3/MEMB-05 invite gate (default false)
  string approved_by = 11;         // D-07 empty = dormant op awaiting Super Admin
  PendingAction pending_action = 12; // D-07 dormant op kind on the entity record
}

// Authoritative persistent room entity record. C++ stamps id/timestamps/
// tombstone; Dart renders. Stored as the value bytes under
// `gcs/entities/rooms/<id>`. Topic is derived: `gcs/chat/<id>`.
message RoomRecord {
  string id = 1;             // opaque C++-minted id (D-01)
  string name = 2;
  string parent_space_id = 3; // empty = standalone (D-01 unified room model)
  int64 created_at_ms = 4;    // wall-clock ms (same stamp as ChatMessageState)
  int64 updated_at_ms = 5;
  bool deleted = 6;           // D-03 tombstone fields, present from creation,
  int64 deleted_at_ms = 7;    // set by NO Phase 2 command
  string creator = 8;              // P2 standalone-room Super Admin (empty for nested rooms)
  bool members_can_invite = 9;     // P3/MEMB-05 creation-time invite gate
  string approved_by = 10;         // D-07 empty = dormant op awaiting Super Admin
  PendingAction pending_action = 11; // D-07 dormant op kind on the entity record
}

// Manifest of known entity ids (D-02). Value bytes under gcs/index/manifest.
// Exists because GcsGlobalDb has no enumeration/prefix query. Writers follow a
// read-union-write convention (append-only membership); readers skip ids whose
// record is missing or tombstoned.
message EntityManifest {
  repeated string space_id = 1;
  repeated string room_id = 2;
}

// Data-only create command (D-27: data-only; C++ stamps authority — the id,
// timestamps, and tombstone fields never come from Dart).
message CreateSpaceCommand {
  string name = 1;
  bool is_public = 2;
  bool auto_join_rooms = 3;
  bool members_can_invite = 4; // P3/MEMB-05 invite gate (default false)
}

// Data-only create command (D-27: data-only; C++ stamps authority).
message CreateRoomCommand {
  string name = 1;
  string parent_space_id = 2; // empty = standalone
  bool members_can_invite = 3; // P3/MEMB-05 invite gate (rooms: creation-time only)
}

// Data-only edit command (D-27: data-only; C++ stamps authority). Full desired
// state, never a patch (per-key LWW replaces the whole value).
message UpdateSpaceCommand {
  string space_id = 1;
  string name = 2;
  bool is_public = 3;
  bool auto_join_rooms = 4;
  bool members_can_invite = 5; // P3/MEMB-05 invite gate (spaces own the post-creation toggle)
}

// Pushed entity-catalog event (D-02): FLAT records — Dart builds the tree.
// Reuses the same record protos stored in the KV values (one type, no drift).
message SpaceTree {
  repeated SpaceRecord space = 1;
  repeated RoomRecord room = 2;
}

// === Phase 3: Messaging (append-only additions — D-04/D-05/D-06) ===

// Batch history replay (D-06): the full sorted room history pushed on join.
message MessageHistory {
  string room_topic = 1;
  repeated ChatMessageState message = 2;
}

// === Phase 4: Membership & Invites (append-only additions — D-05/D-06/D-07/D-08) ===

// Five-tier capability role (MEMB-02/D-08). C++ stamps the role at mint/redeem/
// role-change; it is NEVER read from a client-supplied field (T-04-01-EoP).
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_SUPER_ADMIN = 1;  // the scope creator, singular and never demotable (D-03)
  ROLE_ADMIN = 2;
  ROLE_MODERATOR = 3;
  ROLE_MEMBER = 4;
  ROLE_GUEST = 5;        // read-only — send-path write guard (D-08)
}

// Dormant destructive-op kind carried on the target record (D-07). An empty
// `approved_by` plus a non-zero action means the op awaits Super Admin activation.
enum PendingAction {
  PENDING_ACTION_UNSPECIFIED = 0;
  PENDING_ACTION_REMOVE = 1;
  PENDING_ACTION_ROLE_CHANGE = 2;
  PENDING_ACTION_DELETE = 3;
}

// Room key wrapped under a member's invite-borne key (D-06). `envelope` is the
// raw binary nonce(12)||ciphertext||tag(16) payload and MUST be proto3 `bytes`,
// NOT `string`: a string field would fail UTF-8 validation on parse and empty
// every member list that carries it.
message WrappedRoomKey {
  string room_id = 1;
  bytes envelope = 2;
}

// Per-member LWW record, one per member per scope under
// `gcs/members/<scopeId>/<wallet>` (D-01), enumerated by prefix scan. Full-state
// rewrite, never a patch; tombstone = `deleted`, never key removal (D-03).
message MemberRecord {
  string scope_id = 1;               // space id or standalone room id (D-01)
  string address = 2;                // wallet identity (D-03)
  Role role = 3;                     // C++-stamped five-tier role (MEMB-02)
  bool explicit_leave = 4;           // D-02 derived-join precedence term
  bool deleted = 5;                  // D-03 tombstone, never key removal
  int64 created_at_ms = 6;           // wall-clock ms (same stamp as ChatMessageState)
  int64 updated_at_ms = 7;
  string approved_by = 8;            // D-07 empty = dormant op awaiting Super Admin
  PendingAction pending_action = 9;  // D-07 dormant op kind on this member
  Role pending_role = 10;            // D-07 target role of a dormant role change
  repeated WrappedRoomKey wrapped_room_key = 11; // D-06 room key(s) wrapped under this member's key
}

// Flat, full-replacement roster pushed on the GcsEvent oneof (D-04) — the
// SpaceTree push pattern. `self_address` is the local wallet C++ pushes so Dart
// derives the "You" marker from authority instead of guessing.
message MemberList {
  string scope_id = 1;
  repeated MemberRecord member = 2;
  string self_address = 3;
}

// Pushed `gcs://invite/...` capability link (D-05).
message InviteLink {
  string url = 1;
  string scope_id = 2; // scope authority for the pushed capability link (WR-07;
                       // Dart keys the pending link by scope id, never parses it)
}

// Write-at-redeem invite grant, persisted under `gcs/invites/<scopeId>/<inviteId>`
// (D-05/P4). NOT a member record: nothing is written at mint except this record;
// the redeemer's wallet-keyed MemberRecord is written at redeem.
message InviteRecord {
  string scope_id = 1;
  Role role = 2;                                 // C++-stamped grant (Guest default, D-05)
  repeated WrappedRoomKey wrapped_room_key = 3;  // room key(s) wrapped under the invite key IK
  bool is_space = 4;                             // C++-stamped scope kind, cross-checked
                                                 // against the URL's `{space|room}` segment
                                                 // at redeem (an entity-catalog lookup
                                                 // cannot be used — the redeemer may not
                                                 // hold the scope record)
  string authenticator = 5;                      // C++-stamped, bearer-key-derived proof of
                                                 // invite authority, verified at redeem
                                                 // BEFORE any member-record write (it gates
                                                 // invites that carry no room-key material)
  string created_by = 6;                         // issuing wallet address, C++-stamped from
                                                 // the minter's identity (MEMB-01/CR-08)
  string issuer_signature = 7;                   // issuer's secp256k1 signature over the
                                                 // canonical invite payload, hex-encoded
                                                 // because this is a proto3 string field
                                                 // (same rule as `authenticator`); a
                                                 // signature cannot cover itself, so the
                                                 // payload serializes the record with this
                                                 // field cleared
}

// Data-only commands (D-27: data-only; C++ stamps authority — the id, invite
// key, timestamps, and role authority never come from Dart).

message InviteCommand {
  string scope_id = 1; // space id (`space-...`) or standalone room id (`room-...`)
}

message RedeemCommand {
  string invite_url = 1; // full `gcs://invite/{space|room}/<inviteId>?key=<key>`; C++ re-parses
}

message ChangeRoleCommand {
  string scope_id = 1;
  string target = 2; // wallet address
  Role role = 3;
}

message RemoveMemberCommand {
  string scope_id = 1;
  string target = 2; // wallet address
}

message LeaveCommand {
  string scope_id = 1; // writes `explicit_leave` on the caller's own record (D-02)
}

message DeleteScopeCommand {
  string scope_id = 1;
}

message ApproveCommand {
  string scope_id = 1;
  string target = 2; // member address (remove/role change) or the scope id itself (deletion)
}
