# Run with `dart run ffigen --config ffigen.yaml` from src/app/.
name: GcsBindings
description: Dart bindings for the gcs_ffi C API
output: 'lib/gcs_bindings_generated.dart'
headers:
  entry-points:
    - '../ffi/gcs_core.h'
  include-directives:
    - '../ffi/gcs_core.h'
preamble: |
  // ignore_for_file: always_specify_types
  // ignore_for_file: camel_case_types
  // ignore_for_file: non_constant_identifier_names
comments:
  style: any
  length: full
