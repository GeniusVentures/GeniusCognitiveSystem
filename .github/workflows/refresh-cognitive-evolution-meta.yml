name: Refresh cognitive evolution metadata

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'docs/cognitive-evolution-review-followup'
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: docs/cognitive-evolution-review-followup
          fetch-depth: 0

      - name: Refresh llms metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("llms-meta.json")
          meta = json.loads(path.read_text())
          docs = meta["docs"]

          docs["docs:./system-overview.md"]["hash"] = "39532c9af26efa38"
          docs["docs:./system-overview.md"].pop("stale", None)

          docs["docs:./cognitive-retaining-system.md"]["hash"] = "5b1041a1afb7a8a9"
          docs["docs:./cognitive-retaining-system.md"].pop("stale", None)

          docs["docs:./cognitive-evolution-control.md"] = {
              "hash": "f27594d3fc0c77c7",
              "description": "Answers how GCS turns qualified cognitive events into governed memory, transition, routing, arbitration, benchmark, and EGGROLL adaptation workflows through shared replay and promotion contracts.",
              "category": "architecture",
              "optional": False,
              "exclude": False,
              "nav_section": "**Genius Cognitive System Architecture Documentation**",
          }

          path.write_text(json.dumps(meta, indent=2) + "\n")
          PY

      - name: Commit refreshed metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- llms-meta.json; then
            echo "Metadata is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add llms-meta.json
          git commit -m "Refresh cognitive evolution catalog metadata"
          git push origin HEAD:docs/cognitive-evolution-review-followup
