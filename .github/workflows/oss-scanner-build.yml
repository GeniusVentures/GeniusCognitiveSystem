name: OSS Scanner Docker build

on:
  pull_request:
    paths:
      - '.oss-scanner/**'
      - '.github/workflows/oss-scanner-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout public source only
        uses: actions/checkout@v5
        with:
          submodules: false
          persist-credentials: false

      - name: Validate scanner configuration
        run: |
          set -euo pipefail
          grep -Fx 'repo: https://github.com/GeniusVentures/GeniusCognitiveSystem#develop' .oss-scanner/project.yaml
          grep -Fx 'primary_contact: admin@gnus.ai' .oss-scanner/project.yaml
          test -s .oss-scanner/threat_model.md
          ! grep -nE 'GNUS_TOKEN_1|GH_TOKEN|secrets\\.|--mount=type=secret' .oss-scanner/Dockerfile

      - name: Docker build (public GHCR and checksummed release assets)
        run: docker build --pull --progress=plain --build-arg SCANNER_BUILD_JOBS=3 -f .oss-scanner/Dockerfile -t gcs-oss-scanner:check .

      - name: Offline crypto-adapter regression test
        run: |
          docker run --rm --network none --entrypoint /bin/bash gcs-oss-scanner:check -euo pipefail -c '
            cd /src
            test -d GNUS-NEO-SWARM
            test -d build/Linux/Release/x86_64
            ctest --test-dir build/Linux/Release/x86_64 -R "^test_gcs_crypto$" --output-on-failure --timeout 180
          '
